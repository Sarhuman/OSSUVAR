name: Tests and lint
on:
  pull_request:
  push:
    branches: [main, codex/T-001]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gdtoolkit
        run: python -m pip install gdtoolkit==4.3.4
      - name: Lint project scripts
        run: gdlint core combat data ui world tests
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path . --editor --import
      - name: Run GUT
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit
